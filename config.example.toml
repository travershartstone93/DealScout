[signals]
# independent verification lookups (dealscout/signals.py); all free, no keys
delay = 1.0   # seconds between requests to the same host (search engines: at least 2)
max_hits = 8   # kept web-search hits per query (strict domain/name match)
max_queries = 3   # web-search queries per listing
web_search = true
# search engines, tried in order until one works:
#   google = Google Programmable Search JSON API (official, free 100 queries/day) — needs the two keys below
#   claude = web search through your Claude Code login (no key; each query costs a small Claude call; URLs are liveness-checked)
#   ddg / bing = keyless HTML endpoints (DDG captchas after a burst; Bing is noisy)
engines = ["google", "claude", "ddg", "bing"]
google_api_key = ""   # https://console.cloud.google.com → APIs → Custom Search API → credentials
google_cx = ""   # https://programmablesearchengine.google.com → create engine ("search the entire web") → Search engine ID
claude_search = true
claude_model = "claude-sonnet-5"
