<!doctype html><html><head><meta charset="utf-8"><title>DealScout — source health</title>
<style>:root{--bg:#f6f7f9;--card:#fff;--fg:#1a1d23;--mut:#6b7280;--line:#e5e7eb;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--fg:#e6e8ee;--mut:#9aa1ad;--line:#2a2f3a;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}}
body{margin:0;padding:20px;font:14px system-ui,sans-serif;background:var(--bg);color:var(--fg)}table{border-collapse:collapse;background:var(--card);width:100%}td,th{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-size:12px;text-transform:uppercase}
.ok{color:var(--ok)}.degraded{color:var(--warn)}.error,.never{color:var(--bad)}.alarm{background:var(--card);border-left:4px solid var(--bad);padding:8px 12px;margin:6px 0}</style></head>
<body><h2>Source health <small style="color:var(--mut)">— <a href="/">back</a></small></h2><div id="alarms"></div><table><thead><tr><th>source</th><th>status</th><th>last run</th><th>last seen</th><th>previous</th><th>median (10 runs)</th><th>secs</th><th>last error</th></tr></thead><tbody id="rows"></tbody></table>
<script>fetch('/api/health').then(r=>r.json()).then(d=>{document.getElementById('alarms').innerHTML=(d.alarms||[]).map(a=>`<div class="alarm">${a}</div>`).join('');
document.getElementById('rows').innerHTML=(d.sources||[]).map(s=>`<tr><td>${s.source}</td><td class="${s.status}">${s.status}${s.layout_change_suspected?' — layout change?':''}</td><td>${(s.last_at||'').slice(0,16)}</td><td>${s.last_seen??''}</td><td>${s.prev_seen??''}</td><td>${s.median_seen??''}</td><td>${s.last_secs??''}</td><td>${s.last_error||''}</td></tr>`).join('')})</script></body></html>
